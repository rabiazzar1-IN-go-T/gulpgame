<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gulp! The Hungry Void</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1a1033;--void:#6d28d9;--coral:#ff5d73;--sun:#ffd23f;--mint:#3ee6b4;--paper:#fff8ec;
  --panel:#fff8ec;--panel-2:#efe6ff;--text:#1a1033;--muted:#5d5480;--edge:#1a1033;--scrim:rgba(26,16,51,.42);--scrim-soft:rgba(26,16,51,.12);
  --rim:#8b5cf6;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#241845;--panel-2:#33255e;--text:#fff8ec;--muted:#c3b8e8;--edge:#07030f;--scrim:rgba(6,3,14,.6);--scrim-soft:rgba(6,3,14,.2);color-scheme:dark}}
:root[data-theme="dark"]{--panel:#241845;--panel-2:#33255e;--text:#fff8ec;--muted:#c3b8e8;--edge:#07030f;--scrim:rgba(6,3,14,.6);--scrim-soft:rgba(6,3,14,.2);color-scheme:dark}
html,body{height:100%;overflow:hidden;background:#1a1033}
body{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(10,4,30,.28) 100%)}
button{font:inherit;color:inherit;touch-action:manipulation}
.hidden{display:none!important}

/* ---------- sticker kit ---------- */
.panel{background:var(--panel);border:3px solid var(--edge);border-radius:24px;box-shadow:0 7px 0 var(--edge)}
.btn{font-weight:600;font-size:18px;line-height:1;color:#1a1033;background:var(--paper);border:3px solid var(--edge);border-radius:16px;padding:13px 22px;box-shadow:0 5px 0 var(--edge);cursor:pointer;transition:transform .07s,box-shadow .07s,filter .15s;pointer-events:auto;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.btn.primary{background:var(--sun)}
.btn.mint{background:var(--mint)}
.btn.coral{background:var(--coral);color:#fff}
.btn.big{font-size:32px;padding:16px 60px;border-radius:24px;box-shadow:0 7px 0 var(--edge)}
.btn.big:active{transform:translateY(6px);box-shadow:0 1px 0 var(--edge)}
.btn.icon{padding:11px 14px;font-size:20px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--edge)}
.coin{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2 0 18%,#ffd23f 20% 62%,#e0a100 64%);border:2px solid var(--edge);vertical-align:-.15em;flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--edge);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:18px;pointer-events:auto}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);pointer-events:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);animation:fadeIn .22s ease-out}
.screen.soft{background:linear-gradient(180deg,var(--scrim-soft),var(--scrim) 85%)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:popIn .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.sheet-head h2{font-size:28px;font-weight:700;flex:1;letter-spacing:.2px}
.sheet-body{overflow-y:auto;padding:4px 18px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 18px 20px}

/* ---------- menu ---------- */
.menu-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.logo{position:relative;font-size:clamp(84px,22vw,168px);font-weight:700;line-height:.9;color:var(--sun);-webkit-text-stroke:5px #1a1033;paint-order:stroke fill;text-shadow:0 8px 0 #1a1033;padding-bottom:.32em;display:flex;align-items:flex-end;justify-content:center}
.logo span{display:inline-block;position:relative;z-index:2;animation:dropIn .6s cubic-bezier(.3,1.6,.5,1) both}
.logo span:nth-child(1){transform:rotate(-9deg);animation-delay:.05s}
.logo span:nth-child(2){transform:rotate(5deg) translateY(.04em);animation-delay:.13s;color:var(--mint)}
.logo span:nth-child(3){transform:rotate(-4deg);animation-delay:.21s;color:var(--coral)}
.logo span:nth-child(4){transform:rotate(8deg);animation-delay:.29s}
.logo .bang{color:#fff;transform-origin:50% 100%;animation:dropIn .6s .37s cubic-bezier(.3,1.6,.5,1) both,slurp 5.5s 1.6s ease-in-out infinite}
@keyframes dropIn{from{translate:0 -1.2em;opacity:0}to{translate:0 0;opacity:1}}
@keyframes slurp{0%,70%,100%{rotate:0deg;scale:1}78%{rotate:-18deg;scale:1 .9}86%{rotate:12deg;scale:.95 1.08}}
.logo-hole{position:absolute;left:50%;bottom:.02em;width:1.9em;height:.42em;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#000 0 52%,#2a0f5c 62%,var(--rim) 70%,rgba(139,92,246,0) 74%);z-index:1;filter:drop-shadow(0 0 18px rgba(139,92,246,.7))}
.tag{font-size:20px;font-weight:500;color:#fff;text-shadow:0 2px 0 #1a1033;margin-top:-8px}
.menu-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hint{font-size:15px;color:#fff;opacity:.92;text-shadow:0 2px 0 rgba(26,16,51,.8);max-width:34ch}
.menu-coins{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px)}

/* ---------- level cards ---------- */
.levels{display:grid;gap:14px}
.card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel-2);border:3px solid var(--edge);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--edge);cursor:pointer;width:100%;transition:transform .07s,box-shadow .07s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.card.locked{cursor:not-allowed;opacity:.6}
.thumb{width:76px;height:76px;flex:none;border-radius:16px;border:3px solid var(--edge);position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;left:50%;top:58%;width:44%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:#000;box-shadow:0 0 0 3px var(--rim)}
.card .info{flex:1;min-width:0}
.card h3{font-size:22px;font-weight:700}
.card p{font-size:15px;color:var(--muted);margin-top:2px}
.stars{display:flex;gap:3px;margin-top:6px;font-size:20px}
.star{color:transparent;-webkit-text-stroke:2px var(--edge)}
.star.on{color:var(--sun)}
.lockicon{font-size:26px;padding:0 6px}

/* ---------- shop ---------- */
.tabs{display:flex;gap:8px;padding:0 18px 10px}
.tab{flex:1;font-weight:600;font-size:17px;padding:10px;border:3px solid var(--edge);border-radius:14px;background:var(--panel-2);cursor:pointer;color:var(--text)}
.tab[aria-selected="true"]{background:var(--sun);color:#1a1033}
.ups{display:grid;gap:12px}
.up{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel-2);border:3px solid var(--edge);border-radius:18px;padding:10px 12px}
.up .ic{width:52px;height:52px;border-radius:14px;border:3px solid var(--edge);display:grid;place-items:center;font-size:26px}
.up h4{font-size:19px;font-weight:700}
.up p{font-size:14px;color:var(--muted)}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:8px;border-radius:3px;background:var(--panel);border:2px solid var(--edge)}
.pips i.on{background:var(--mint)}
.up .btn{font-size:16px;padding:10px 12px;display:flex;align-items:center;gap:6px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.skin{background:var(--panel-2);border:3px solid var(--edge);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.skin.eq{background:var(--mint);color:#1a1033}
.swatch{width:84px;height:84px;border-radius:50%;border:3px solid var(--edge)}
.skin h4{font-size:17px;font-weight:700}
.skin .btn{font-size:15px;padding:9px 12px;display:flex;gap:6px;align-items:center}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px dashed color-mix(in srgb,var(--edge) 25%,transparent);font-size:19px;font-weight:500}
.seg{display:flex;border:3px solid var(--edge);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:8px 12px;font-weight:600;font-size:15px;cursor:pointer;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--sun);color:#1a1033}

/* ---------- intro / results ---------- */
.brief h2{font-size:34px}
.brief .blurb{color:var(--muted);font-size:17px;margin-top:2px}
.goals{list-style:none;display:grid;gap:10px;margin:14px 0 4px}
.goals li{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:3px solid var(--edge);border-radius:16px;padding:10px 12px;font-size:18px;font-weight:500}
.goals .gstar{font-size:24px;color:var(--sun);-webkit-text-stroke:2px var(--edge)}
.goals li.done{background:var(--mint);color:#1a1033}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:16px;margin-top:8px}
.result-title{font-size:40px;font-weight:700;text-align:center}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:64px;margin:6px 0}
.bigstars .star{transform:scale(.4);opacity:.35;transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.bigstars .star.on{transform:scale(1);opacity:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.stat{background:var(--panel-2);border:3px solid var(--edge);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:14px;color:var(--muted)}
.earn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:34px;font-weight:700;margin-top:14px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.hud-top{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sizebox{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--edge);border-radius:999px;box-shadow:0 4px 0 var(--edge);padding:5px 14px 5px 5px}
.size-badge{width:46px;height:46px;border-radius:50%;background:#000;box-shadow:inset 0 0 0 4px var(--rim),0 0 14px var(--rim);display:grid;place-items:center;color:#fff;font-weight:700;font-size:21px;flex:none}
.size-badge.bounce{animation:badgePop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes badgePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.sizetxt{display:flex;flex-direction:column;gap:4px}
.sizetxt small{font-size:13px;font-weight:600;color:var(--muted);line-height:1}
.xp{width:clamp(80px,22vw,150px);height:13px;border:2.5px solid var(--edge);border-radius:10px;background:var(--panel-2);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width .25s ease-out}
.timer{min-width:92px;text-align:center;font-size:28px;font-weight:700;background:var(--panel);border:3px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);padding:4px 12px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--coral);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.hud-right{display:flex;gap:8px;align-items:center}
.hud-right .btn{pointer-events:auto;padding:9px 12px;font-size:18px;box-shadow:0 4px 0 var(--edge)}
.objectives{position:absolute;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 76px);display:grid;gap:6px;max-width:min(300px,62vw)}
.obj{display:flex;align-items:center;gap:8px;background:var(--panel);border:2.5px solid var(--edge);border-radius:12px;padding:5px 10px;font-size:14px;font-weight:600;box-shadow:0 3px 0 var(--edge)}
.obj .s{font-size:16px;color:transparent;-webkit-text-stroke:1.6px var(--edge)}
.obj.done{background:var(--mint);color:#1a1033}
.obj.done .s{color:var(--sun)}
.obj .pv{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.obj.done .pv{color:#1a1033}
.combo{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);font-size:30px;font-weight:700;color:var(--sun);-webkit-text-stroke:3px #1a1033;paint-order:stroke fill;text-shadow:0 4px 0 #1a1033;opacity:0;transition:opacity .25s;white-space:nowrap}
.combo.on{opacity:1}
.combo.bump{animation:bump .25s}
@keyframes bump{50%{scale:1.25}}
.toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);background:var(--panel);border:3px solid var(--edge);border-radius:20px;box-shadow:0 6px 0 var(--edge);padding:12px 20px;font-size:22px;font-weight:700;text-align:center;opacity:0;pointer-events:none;max-width:86vw}
.toast small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:2px}
.toast.show{animation:toast 2.4s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}16%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.abilities{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;pointer-events:none}
.ab{--p:0;--a:0;--c:#fff;position:relative;width:62px;height:62px;border-radius:50%;border:3px solid var(--edge);background:var(--panel);box-shadow:0 5px 0 var(--edge);display:grid;place-items:center;cursor:pointer;pointer-events:auto;color:var(--text);transition:transform .07s}
.ab:active{transform:translateY(3px)}
.ab svg{width:30px;height:30px;position:relative;z-index:2}
.ab::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--a)*1turn),transparent 0);z-index:0;opacity:.95;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.ab .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,4,24,.62) calc(var(--p)*1turn),transparent 0);z-index:3}
.ab .key{position:absolute;top:-8px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--sun);border:2.5px solid var(--edge);font-size:12px;font-weight:700;display:grid;place-items:center;color:#1a1033;z-index:4}
.ab .lk{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel-2);z-index:5;color:var(--muted);text-align:center;line-height:1.1}
.ab.ready{background:var(--c);color:#1a1033}
.ab.ready::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:ring 1.6s infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.ab.active{background:var(--panel);color:var(--text)}
.ab .nm{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 0 #000,0 0 4px #000;white-space:nowrap;z-index:4}
.joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(26,16,51,.25);opacity:0;transition:opacity .15s;pointer-events:none}
.joy.on{opacity:1}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid #1a1033}
#popups{position:absolute;inset:0;overflow:hidden}
.pop{position:absolute;font-weight:700;font-size:20px;color:#fff;-webkit-text-stroke:3px #1a1033;paint-order:stroke fill;white-space:nowrap;transform:translate(-50%,-50%);animation:floatUp .9s ease-out forwards;pointer-events:none}
.pop.big{font-size:30px;color:var(--sun)}
.pop.no{color:var(--coral);font-size:18px}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%) scale(.9)}}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,var(--rim));opacity:0;transition:opacity .4s}
.flash.on{opacity:.35}
#loading{position:fixed;inset:0;background:#1a1033;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-size:22px;font-weight:600;z-index:10;pointer-events:auto}
#loading .spin{width:70px;height:70px;border-radius:50%;background:#000;box-shadow:0 0 0 5px var(--rim),0 0 30px var(--rim);animation:spin 1s linear infinite;position:relative}
#loading .spin::after{content:"";position:absolute;inset:14px;border-radius:50%;border:4px solid transparent;border-top-color:var(--rim)}
@keyframes spin{to{transform:rotate(1turn)}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#1a1033;color:#fff;font-size:18px;z-index:20;text-align:center}

@media (max-width:640px){
  .ab{width:54px;height:54px}.ab svg{width:26px;height:26px}
  .abilities{left:0;right:0;justify-content:center;gap:9px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
  .timer{font-size:24px;min-width:78px}
  .size-badge{width:40px;height:40px;font-size:18px}
  .obj{font-size:12.5px;padding:4px 8px}
  .objectives{top:calc(env(safe-area-inset-top,0px) + 68px)}
  .sheet-head h2{font-size:24px}
  .btn.big{font-size:28px;padding:14px 48px}
  .stats{grid-template-columns:1fr 1fr}
  .hud-top{gap:6px}.sizebox{padding:4px 10px 4px 4px;gap:7px}.xp{width:clamp(56px,17vw,120px)}
  .hud-right{gap:6px}.hud-right .chip{font-size:15px;padding:5px 10px 5px 6px}.hud-right .btn{padding:8px 10px;font-size:15px}
  .combo{left:calc(env(safe-area-inset-left,0px) + 14px);transform:none;top:calc(env(safe-area-inset-top,0px) + 186px);font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  .logo span,.logo .bang{animation:none!important}
  .ab.ready::after,.timer.low{animation:none}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Game view"></canvas>
<div id="ui">
  <div class="vignette"></div>
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="sizebox"><div class="size-badge" id="sizeNum">1</div><div class="sizetxt"><small id="sizeLbl">Size 1</small><div class="xp"><i id="xpFill"></i></div></div></div>
      <div class="timer" id="timer">2:30</div>
      <div class="hud-right"><div class="chip"><i class="coin"></i><span id="hudCoins">0</span></div><button class="btn" id="pauseBtn" aria-label="Pause">❚❚</button></div>
    </div>
    <div class="objectives" id="objectives"></div>
    <div class="combo" id="combo"></div>
    <div class="toast" id="toast"></div>
    <div class="abilities" id="abilities"></div>
    <div class="joy" id="joy"><i></i></div>
    <div id="popups"></div>
  </div>
  <div class="flash" id="flash"></div>

  <section class="screen soft hidden" id="scr-menu">
    <div class="menu-wrap">
      <h1 class="logo" aria-label="Gulp!"><span>G</span><span>U</span><span>L</span><span>P</span><span class="bang">!</span><i class="logo-hole"></i></h1>
      <p class="tag">Start tiny. Swallow the whole city.</p>
      <button class="btn big primary" id="btnPlay">Play</button>

function place(p,x,z,yaw=0,o={}){
  const c=Math.abs(Math.cos(yaw)),s=Math.abs(Math.sin(yaw));
  const ob={p,x,z,yaw,base:o.base||0,hover:o.hover||0,h:p.h,ew:p.w*c+p.d*s,ed:p.w*s+p.d*c,

    val:p.w*p.d*(1+Math.min(p.h/Math.max(p.w,p.d,.1),4)*.35)*(o.valMul||1),
    tag:o.tag||null,mv:o.mv||null,sup:o.sup||null,state:0,vx:0,vz:0,vy:0,tilt:0,tux:0,tuz:0,ax:0,az:0,av:0,t:0,wob:0,idx:-1,mesh:null,seed:Math.random()*100,
    qy:new THREE.Quaternion().setFromAxisAngle(UP,yaw),q:new THREE.Quaternion()};
  ob.cr=Math.min(p.w,p.d)*.45+.05;ob.baseY=ob.base+p.h/2+ob.hover;ob.y=ob.baseY;ob.q.copy(ob.qy);
  W.objs.push(ob);if(p.shared)p.insts.push(ob);else W.uniq.push(ob);

// block occupancy helpers
function occFree(b,x,z,r){if(x-r<b.x0||x+r>b.x1||z-r<b.z0||z+r>b.z1)return false;for(const o of b.occ){if(x+r>o[0]&&x-r<o[2]&&z+r>o[1]&&z-r<o[3])return false;}return true;}
function occAdd(b,x,z,hw,hd){b.occ.push([x-hw,z-hd,x+hw,z+hd]);}
function put(b,p,x,z,yaw=0,o={}){const ob=place(p,x,z,yaw,o);occAdd(b,x,z,ob.ew/2,ob.ed/2);return ob;}
function scatter(b,n,fn,margin=.3,tries=12){let placed=0;for(let i=0;i<n;i++){const [p,o]=fn();const r=Math.max(p.w,p.d)/2+margin;
  for(let t=0;t<tries;t++){const x=rr(b.ix0+r,b.ix1-r),z=rr(b.iz0+r,b.iz1-r);if(occFree(b,x,z,r)){put(b,p,x,z,rr(0,TAU),o||{});placed++;break;}}}return placed;}
function sidewalk(b,step,choose){const ins=b.sw/2;
  const E=[[b.x0,b.z0+ins,b.x1,b.z0+ins,Math.PI],[b.x0,b.z1-ins,b.x1,b.z1-ins,0],[b.x0+ins,b.z0,b.x0+ins,b.z1,-H2],[b.x1-ins,b.z0,b.x1-ins,b.z1,H2]];
  for(const e of E){const len=Math.hypot(e[2]-e[0],e[3]-e[1]);let i=0;for(let t=b.sw+1.2;t<len-b.sw-1.2;t+=step*(.85+rng()*.4)){const c=choose(i++);if(c){const x=e[0]+(e[2]-e[0])*t/len,z=e[1]+(e[3]-e[1])*t/len;const ob=place(c[0],x,z,e[4]+(c[2]||0),c[1]||{});occAdd(b,x,z,ob.ew/2,ob.ed/2);}}}}
function walkers(b,n,keyFn){const ins=b.sw/2,r={x0:b.x0+ins,z0:b.z0+ins,x1:b.x1-ins,z1:b.z1-ins};const per=2*(r.x1-r.x0+r.z1-r.z0);
  for(let i=0;i<n;i++)place(keyFn(),0,0,0,{mv:{type:'walk',r,per,p:rng()*per,dir:chance(.5)?1:-1,sp:rr(.9,1.5)}});}
function wanderers(rect,n,keyFn){for(let i=0;i<n;i++)place(keyFn(),rr(rect.x0,rect.x1),rr(rect.z0,rect.z1),0,{mv:{type:'wander',r:rect,a:rng()*TAU,sp:rr(.7,1.3),t:0}});}
const person=()=>getPF('person',ri(0,7));
const worker=()=>getPF('person',ri(0,7),1);

function buildLevel(li,demo){
  teardown();
  const L=LEVELS[li],T=THEMES[L.theme];
  rng=mulberry32(9137+li*7919+(demo?31:0));
  W={li,L,T,objs:[],uniq:[],movers:[],live:[],group:new THREE.Group(),paint:[],grid:null,demo:!!demo};
  for(const p of PFC.values())p.insts=[];
  const P=L.pitch,R=L.road,n=L.n,half=P*n/2;W.half=half;W.road=R;W.E=half+R/2+14;W.wrap=half+R/2;
  W.roads=[];for(let k=0;k<=n;k++)W.roads.push(-half+k*P);W.sx=W.sz=W.roads[Math.floor(n/2)];
  const sw={suburb:2,downtown:2.5,industrial:2,future:2,giant:3}[L.theme];
  const blocks=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x0=-half+i*P+R/2,z0=-half+j*P+R/2,x1=x0+P-R,z1=z0+P-R;
    blocks.push({i,j,x0,z0,x1,z1,sw,ix0:x0+sw,iz0:z0+sw,ix1:x1-sw,iz1:z1-sw,occ:[],type:'',ground:null});}
  W.blocks=blocks;const at=(i,j)=>blocks[i*n+j];
  FILL[L.theme](blocks,at);
  // traffic
  const lane=R/4,len=half*2+R;
  W.roads.forEach((rp)=>{for(const dirAxis of[0,1])for(const side of[-1,1]){const cnt=Math.max(1,Math.floor(len/(L.theme==='giant'?40:28)));const sp=rr(4.5,8.5);const off=rng()*len;
    for(let k=0;k<cnt;k++){if(chance(.25))continue;const [key,arg]=T.cars();const p=getPF(key,arg);const s=((off+k*len/cnt)%len)-len/2;const dir=side;
      const x=dirAxis===0?rp+lane*side:s,z=dirAxis===0?s:rp-lane*side;const yaw=dirAxis===0?(dir>0?0:Math.PI):(dir>0?H2:-H2);
      place(p,x,z,yaw,{tag:'car',hover:p.key.startsWith('hover')?.7:0,mv:{type:'drive',vx:dirAxis===1?sp*dir:0,vz:dirAxis===0?sp*dir:0}});}}});
  finalizeWorld();
}

    const hp=uniq(B=>UNI.house(B,{w,d,fl,wall:pick([0xf6e7c1,0xcfe8ef,0xf7d6d0,0xe3f0d3,0xfff3e0,0xd9d4f0,0xffe1a8]),roof:pick([0x8c4a3b,0x4a5a7a,0x6b4f3a,0x3d6b5a,0xa0522d,0x7a3b5e]),trim:pick([0x8c4a3b,0x2b59c3,0x2a9d8f,0x5a4632]),rh:rr(1.6,2.4),chim:chance(.5)}));

    put(b,getPF('mailbox'),hx-w/2+.2,front+sg*.45,yaw);
    for(let k=0;k<3;k++){const bx=hx+rr(-w/2+.5,w/2-.5),bz=hz-sg*(d/2+.65);if(occFree(b,bx,bz,.45))put(b,getPF(chance(.7)?'bush':'flowers',chance(.7)?undefined:pick(FLOWER_C)),bx,bz,rr(0,TAU));}
    const fy=n?area(b,x0+.2,z0+.9,x1-.2,z0+2.6):area(b,x0+.2,z1-2.6,x1-.2,z1-.9);

    scatter(by,ri(1,3),()=>[getPF(pick(['bush','trash','crate','barrel']),undefined)],.2);
    if(n){for(let x=x0+1.15;x<x1-1;x+=2.25)if(occFree(b,x,mz-.12,.2))put(b,getPF('fence'),x,mz-.12,0);}
    if(x1===mx){for(let z=z0+1.4;z<z1-1;z+=2.25)if(occFree(b,mx-.12,z,.2))put(b,getPF('fence'),mx-.12,z,H2);}
  }}
function subShops(b){const iw=b.ix1-b.ix0,n=3,sw=iw/n;

function renderShop(){const ul=$('#upList');ul.innerHTML='';UPGRADES.forEach(U=>{const l=save.up[U.id],max=l>=UP_MAX,cost=upCost(l);
  const d=document.createElement('div');d.className='up';
  d.innerHTML=`<div class="ic" style="background:${U.col}" aria-hidden="true">${U.ic}</div><div><h4></h4><p></p><div class="pips">${Array.from({length:UP_MAX},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>`;
  d.querySelector('h4').textContent=U.name+(l?' · Lv '+l:'');d.querySelector('p').textContent=l?U.desc(l):U.desc(1).replace(/^/,'Next: ');
  const b=document.createElement('button');b.className='btn'+(max?'':' primary');b.disabled=max||save.coins<cost;b.innerHTML=max?'Maxed':`<i class="coin"></i>${fmt(cost)}`;
  if(!max)b.setAttribute('aria-label','Upgrade '+U.name+' for '+cost+' coins');
  b.addEventListener('click',()=>{if(save.coins<cost||max){SFX.deny();return;}save.coins-=cost;save.up[U.id]++;persist();SFX.buy();refreshMenus();});d.appendChild(b);ul.appendChild(d);});
  const sl=$('#skinList');sl.innerHTML='';SKINS.forEach(S=>{const own=save.skins.includes(S.id),eq=save.skin===S.id;const d=document.createElement('div');d.className='skin'+(eq?' eq':'');
    const sw=S.rainbow?'conic-gradient(#ff5d73,#ffd23f,#3ee6b4,#7cc8ff,#b69cff,#ff5d73)':hex(S.rim);
    d.innerHTML=`<div class="swatch" style="background:radial-gradient(circle,#000 0 44%,transparent 46%),${sw};box-shadow:0 0 18px ${hex(S.glow)}"></div><h4></h4>`;d.querySelector('h4').textContent=S.name;
    const b=document.createElement('button');b.className='btn'+(own?'':' primary');
    if(eq){b.textContent='Equipped';b.disabled=true;}else if(own){b.textContent='Equip';}else{b.innerHTML=`<i class="coin"></i>${fmt(S.price)}`;b.disabled=save.coins<S.price;}
    b.addEventListener('click',()=>{if(!own){if(save.coins<S.price){SFX.deny();return;}save.coins-=S.price;save.skins.push(S.id);SFX.buy();}else SFX.click();save.skin=S.id;applySkin();persist();refreshMenus();});
    d.appendChild(b);sl.appendChild(d);});}
function renderSettings(){$$('.seg').forEach(seg=>{const k=seg.dataset.set;const v=save.settings[k];seg.querySelectorAll('button').forEach(b=>{const bv=b.dataset.v;b.setAttribute('aria-pressed',String(k==='quality'?bv===v:(bv==='1')===!!v));});});}
$$('.seg').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=seg.dataset.set;save.settings[k]=k==='quality'?b.dataset.v:b.dataset.v==='1';
  SFX.init();SFX.apply();if(k==='quality')applyQuality();persist();renderSettings();SFX.click();}));
$$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.setAttribute('aria-selected',String(x===t)));$('#upList').classList.toggle('hidden',t.dataset.tab!=='ups');$('#skinList').classList.toggle('hidden',t.dataset.tab!=='skins');SFX.click();}));
$$('[data-back]').forEach(b=>b.addEventListener('click',()=>{SFX.click();if(curScreen==='settings'&&mode==='game'){showScreen('pause');return;}showScreen('menu');}));
let resetArm=0;$('#btnReset').addEventListener('click',e=>{const b=e.currentTarget;if(!resetArm){resetArm=1;b.textContent='Tap again to erase';setTimeout(()=>{resetArm=0;b.textContent='Reset progress';},3000);return;}
  resetArm=0;b.textContent='Reset progress';const st=save.settings;save=defaultSave();save.settings=st;persist();applySkin();refreshMenus();SFX.deny();});
$('#btnPlay').addEventListener('click',()=>{SFX.init();SFX.click();let li=Math.min(save.unlocked,LEVELS.length)-1;for(let i=0;i<save.unlocked;i++){if(save.levels[i].stars===0){li=i;break;}}openIntro(li);});
$('#btnLevels').addEventListener('click',()=>{SFX.init();SFX.click();renderLevels();showScreen('levels');});
$('#btnShop').addEventListener('click',()=>{SFX.init();SFX.click();renderShop();showScreen('shop');});
$('#btnSettings').addEventListener('click',()=>{SFX.init();SFX.click();renderSettings();showScreen('settings');});
$('#pauseBtn').addEventListener('click',()=>{SFX.click();pauseGame();});
$('#btnResume').addEventListener('click',()=>{SFX.click();resumeGame();});
$('#btnPauseSettings').addEventListener('click',()=>{SFX.click();renderSettings();showScreen('settings');});
$('#btnRestart').addEventListener('click',()=>{SFX.click();const li=W.li;withLoading(()=>{buildLevel(li,false);resetHole(false);startGame();});});
$('#btnQuit').addEventListener('click',()=>{SFX.click();goMenu();});
$('#introBack').addEventListener('click',()=>{SFX.click();mode='demo';resetHole(true);W.touched=true;renderLevels();showScreen('levels');});
$('#introGo').addEventListener('click',()=>{SFX.init();SFX.click();if(W.touched||W.demo){const li=W.li;withLoading(()=>{buildLevel(li,false);resetHole(false);startGame();});}else startGame();});
$('#resMenu').addEventListener('click',()=>{SFX.click();goMenu();});
$('#resRetry').addEventListener('click',()=>{SFX.click();const li=W.li;withLoading(()=>{buildLevel(li,false);resetHole(false);startGame();});});
$('#resNext').addEventListener('click',()=>{SFX.click();if(W.li+1<LEVELS.length&&save.unlocked>W.li+1)openIntro(W.li+1);});

function withLoading(fn,txt){const l=$('#loading');$('#loadTxt').textContent=txt||'Building the city…';l.style.display='flex';l.style.opacity='1';
  requestAnimationFrame(()=>setTimeout(()=>{try{fn();}catch(err){showErr(err);}l.style.display='none';},30));}
function openIntro(li){const go=()=>{mode='idle';state='intro';
    $('#introName').textContent=LEVELS[li].name;$('#introBlurb').textContent=LEVELS[li].blurb;renderGoals($('#introGoals'),objRows());
    const rec=save.levels[li];$('#introMeta').innerHTML='';const m1=document.createElement('span');m1.textContent='⏱ '+fmtTime(LEVELS[li].time);const m2=document.createElement('span');m2.innerHTML='Best '+starsHTML(rec.stars);m2.style.display='inline-flex';m2.style.gap='2px';$('#introMeta').append(m1,m2);
    showScreen('intro');};
  if(!W||W.li!==li||W.demo||W.touched)withLoading(()=>{buildLevel(li,false);resetHole(false);go();});else{resetHole(false);go();}}
function startGame(){mode='game';state='play';showScreen(null);buildHUD();lastTimerTxt='';toastQ=[];
  toast(W.L.name,'Reach size '+W.goalSize+' to clear the level');
  if(save.tutorial){H.tut=1;setTimeout(()=>{if(state==='play'&&H.tut)toast(isTouch?'Drag anywhere to move':'Move with WASD or arrow keys','Swallow things smaller than you');},2600);}
  canvas.focus({preventScroll:true});}
function pauseGame(){if(state!=='play')return;state='pause';joyEnd();renderGoals($('#pauseGoals'),objRows());showScreen('pause');}
function resumeGame(){if(state!=='pause'&&curScreen!=='settings')return;state='play';showScreen(null);}
function goMenu(){withLoading(()=>{const li=Math.max(0,Math.min(save.unlocked,LEVELS.length)-1);buildLevel(li,true);resetHole(true);mode='demo';state='menu';refreshMenus();showScreen('menu');},'Heading back…');}
function showResults(){state='results';mode='idle';joyEnd();
  const L=W.L,li=W.li,st=starsNow(),ns=st.filter(Boolean).length,pct=H.eatenVal/W.totalVal,greed=1+.1*save.up.greed;
  const base=runCoins(),bonus=Math.round(ns*30*(li+1)*greed),total=base+bonus;
  save.coins+=total;const rec=save.levels[li];rec.stars=Math.max(rec.stars,ns);rec.best=Math.max(rec.best,Math.round(pct*100));save.tutorial=false;
  let unlockedNew=false;if(st[0]&&li+1<LEVELS.length&&save.unlocked<li+2){save.unlocked=li+2;unlockedNew=true;}persist();
  $('#resTitle').textContent=st[0]?pick(['Delicious!','Scrumptious!','What a feast!','Burp!']):'So close!';
  renderGoals($('#resGoals'),objRows());
  const stats=[[fmt(H.count),'Things swallowed'],[Math.floor(pct*100)+'%',L.name+' eaten'],['Size '+H.maxSize,'Biggest size'],['×'+H.maxCombo,'Best combo']];
  const se=$('#resStats');se.innerHTML='';stats.forEach(s=>{const d=document.createElement('div');d.className='stat';const b=document.createElement('b');b.textContent=s[0];const sp=document.createElement('span');sp.textContent=s[1];d.append(b,sp);se.appendChild(d);});
  if(unlockedNew){const d=document.createElement('div');d.className='stat';d.style.gridColumn='1/-1';d.style.background='var(--sun)';d.style.color='#1a1033';const b=document.createElement('b');b.textContent=LEVELS[li+1].name+' unlocked';const sp=document.createElement('span');sp.style.color='#1a1033';sp.textContent='A bigger city is waiting';d.append(b,sp);se.appendChild(d);}
  const stars=$$('#resStars .star');stars.forEach(s=>s.classList.remove('on'));
  const nb=$('#resNext');nb.classList.toggle('hidden',li+1>=LEVELS.length);nb.disabled=save.unlocked<li+2;$('#resRetry').classList.toggle('primary',!st[0]);nb.classList.toggle('primary',st[0]);
  showScreen('results');if(st[0])SFX.fanfare();else SFX.fail();
  st.forEach((on,i)=>{if(on)setTimeout(()=>{stars[i].classList.add('on');SFX.star(i);},500+i*380);});
  const ce=$('#resCoins');const t0=performance.now(),dur=1300;ce.textContent='+0';
  (function cnt(){const k=Math.min(1,(performance.now()-t0)/dur);ce.textContent='+'+fmt(total*k*(2-k));SFX.coin();if(k<1&&curScreen==='results')requestAnimationFrame(cnt);else ce.textContent='+'+fmt(total);})();
  refreshMenus();}

// =================== LOOP ===================
function updateGame(dt){H.time+=dt;
  if(state==='play'){H.timeLeft-=dt;const c=Math.ceil(H.timeLeft);if(H.timeLeft<=10&&c!==H.lastTick&&c>0){H.lastTick=c;SFX.tick();}if(H.timeLeft<=0){H.timeLeft=0;beginEnd('time');}}
  let ix=0,iz=0;if(state==='play'){[ix,iz]=readInput();if(H.tut&&(ix||iz))H.tut=0;}
  moveHole(dt,ix,iz);abilitiesTick(dt);updateWorld(dt);checkProgress();
  if(state==='ending'){endT-=dt;if(endT<=0)showResults();}}
function updateDemo(dt){H.time+=dt;H.aiT-=dt;
  if(H.aiT<=0){H.aiT=.5;let best=null,bs=-1e9;const R=H.Re,lim=(30+R*5)**2;for(const o of W.live){if(o.state!==0||o.size>=R*EAT*.9)continue;const dx=o.x-H.x,dz=o.z-H.z,d2=dx*dx+dz*dz;if(d2>lim)continue;const s=Math.log(o.val+1)*4-Math.sqrt(d2)*.5;if(s>bs){bs=s;best=o;}}
    H.target=best;if(!best){H.wx=rr(-W.half,W.half);H.wz=rr(-W.half,W.half);}}
  let tx=H.target?H.target.x:(H.wx||0),tz=H.target?H.target.z:(H.wz||0);const dx=tx-H.x,dz=tz-H.z,l=Math.hypot(dx,dz);
  moveHole(dt,l>.5?dx/l:0,l>.5?dz/l:0);updateWorld(dt);checkProgress();
  if(H.time>80||H.eatenVal>W.totalVal*.35){buildLevel(W.li,true);resetHole(true);}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(!(dt>0))return;if(dt>.05)dt=.05;
  if(W){
    if(mode==='game'&&(state==='play'||state==='ending'))updateGame(dt);
    else if(mode==='demo')updateDemo(dt);
    else if(mode==='idle'||state==='results'){H.time+=dt;updateMovers(dt);}
    compactT-=dt;if(compactT<=0){compactT=2;W.live=W.live.filter(o=>o.state!==3);}
    updateHoleVis(dt);updateCamera(dt);updateOcclusion(dt);
    for(const p of W.inst)if(p.dirty){p.imesh.instanceMatrix.needsUpdate=true;p.dirty=false;}
  }
  updateP(dt);if(mode==='game')updateHUD(dt);
  renderer.render(scene,camera);}
function showErr(err){console.error(err);const el=$('#err');el.style.display='flex';el.textContent='Something went wrong: '+(err&&err.message||err)+'. Reload the page to try again.';}

// =================== BOOT ===================
try{
  applyQuality();applySkin();refreshMenus();
  buildLevel(Math.max(0,Math.min(save.unlocked,LEVELS.length)-1),true);resetHole(true);mode='demo';state='menu';
  showScreen('menu');$('#loading').style.display='none';
  requestAnimationFrame(loop);
  Cloud.init();
}catch(err){showErr(err);}
window.__gulp={setK(a,b,c,d){MEXP=a;PHI_K=b;GOAL_K=c;if(d)GAM=d;if(arguments[4])BK=arguments[4];},get W(){return W;},H,LEVELS,buildLevel,resetHole,startGame,activate,get state(){return state;},keys,openIntro,showResults};
})();
</script>
